name: Prax Teach public source
on:
  push:
    paths: ['skills/teacher/**', 'skills/teach-pro-max/**', '.github/workflows/teach-public-source.yml']
  pull_request:
    paths: ['skills/teacher/**', 'skills/teach-pro-max/**', '.github/workflows/teach-public-source.yml']
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Explicit YAML dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/teach-source"
          "$RUNNER_TEMP/teach-source/bin/pip" install PyYAML==6.0.3
      - name: Portable source checks
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          PY="$RUNNER_TEMP/teach-source/bin/python"
          "$PY" skills/teacher/scripts/vendor.py verify
          "$PY" skills/teach-pro-max/scripts/verify_distribution.py
          "$PY" skills/teacher/scripts/tests/test_teacher.py
          "$PY" -m unittest discover -s skills/teacher/scripts/tests -p test_find_tool.py -v
          "$PY" -m unittest discover -s skills/teacher/scripts/tests -p test_manim_resolution.py -v
          node --test skills/teacher/skills/course/scripts/publish_videos.test.mjs skills/teacher/skills/explorable/scripts/bundle_templates.test.mjs skills/teacher/skills/explorable/scripts/report.test.mjs
